name: Claude 规则每日维护

on:
  schedule:
    # 00:17 UTC = 北京时间 08:17；GitHub 调度可能延迟。
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'

permissions:
  contents: read

concurrency:
  group: claude-rules-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    name: 离线边界测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  publish:
    name: 核验并发布
    needs: test
    if: github.repository == 'J606y/claude-rules' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate sources and update rules
        run: python3 scripts/update.py
      - name: Record successful check
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          rules = Path('Loon/Claude.list').read_bytes()
          record = {
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'workflow_run_url': os.environ['RUN_URL'],
              'rule_count': sum(bool(line.strip()) and not line.lstrip().startswith('#') for line in rules.decode().splitlines()),
              'rules_sha256': hashlib.sha256(rules).hexdigest(),
          }
          Path('maintenance.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"校验通过：{record['rule_count']} 条规则。\n\n")
              summary.write(f"规则 SHA-256：`{record['rules_sha256']}`\n\n")
              summary.write('来源失败、格式异常或集合不一致时，不发布本次结果。\n')
          PY
      - name: Publish verified files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Loon/Claude.list Clash/Claude.yaml metadata.json maintenance.json
          if git diff --cached --quiet; then
            printf 'No changes to publish.\n'
            exit 0
          fi
          git commit -m 'chore: verify Claude rules and record daily maintenance'
          git push origin HEAD:main
